[package]
name = "agent_ai"
version = "0.1.0"
edition = "2021"
description = "Executor local seguro para o AetherCore via MCP/STDIO"
license = "MIT"

[lib]
name = "agent_ai"
path = "src/lib.rs"

[[bin]]
name = "agent-ai"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.134"
